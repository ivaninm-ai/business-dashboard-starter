# Runs the checks on every push and pull request: figures against the answer keys,
# reading an updated Excel, matching other layouts, translations, the Gemini number
# check, and the single-file build.
# No secrets are used.
name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
